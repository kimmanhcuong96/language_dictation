<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#27804F" />
    <link rel="icon" href="/me2write-favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="description" content="Luyện nghe tiếng Anh qua phương pháp chép chính tả từng câu." />
  <title>Me2Listen | Listen and Dictate</title>
  <style>html.js #root > .seo-lesson,html.js #root > .seo-library{display:none}</style>
  <script>document.documentElement.classList.add("js");(()=>{try{const saved=localStorage.getItem("me2listen-theme");const theme=saved==="light"||saved==="dark"?saved:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme;document.querySelector('meta[name="theme-color"]').content=theme==="dark"?"#111713":"#27804f"}catch{document.documentElement.dataset.theme="light"}})()</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
